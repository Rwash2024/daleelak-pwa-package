<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليلك — دليل محلات النزهة وقباء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D93829">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليلك">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&family=Fredoka:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#FBF1E4;
    --paper:#FFFFFF;
    --red:#D93829;
    --red-dark:#A82B1F;
    --ink:#2B211B;
    --gold:#E8A33D;
    --gold-dark:#B87A22;
    --muted:#8C7A6B;
    --line:#E9DDC8;
  }
  [data-theme="dark"]{
    --cream:#1C1712;
    --paper:#262019;
    --red:#E2483C;
    --red-dark:#F06B5E;
    --ink:#F3E9DC;
    --gold:#F0B559;
    --gold-dark:#F5C578;
    --muted:#A89685;
    --line:#3B3225;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:'Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  body.lang-en{font-family:'Poppins',sans-serif;}
  .display{font-family:'Lalezar',sans-serif;}
  body.lang-en .display{font-family:'Fredoka',sans-serif;}
  .app{max-width:1100px;margin:0 auto;padding:0 16px 48px;}

  header.top{
    background:var(--red);
    color:#fff;
    padding:18px 16px 22px;
    border-radius:0 0 22px 22px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute;
    bottom:0;left:0;right:0;
    height:10px;
    background-image:radial-gradient(circle, var(--cream) 5px, transparent 5.5px);
    background-size:22px 20px;
    background-position:0 -6px;
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{
    width:40px;height:40px;border-radius:10px;background:var(--cream);
    display:flex;align-items:center;justify-content:center;
    color:var(--red);font-size:22px;flex-shrink:0;
  }
  .brand-name{font-size:26px;line-height:1;}
  .brand-sub{font-size:11px;opacity:.85;margin-top:2px;}
  .top-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .icon-btn{
    width:34px;height:34px;border-radius:10px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:'Tajawal',sans-serif;font-weight:700;
  }
  .area-pill{
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
  }
  .search-bar{
    max-width:1100px;margin:16px auto 0;
    background:var(--paper);border-radius:14px;
    display:flex;align-items:center;gap:8px;
    padding:12px 14px;color:var(--muted);font-size:14px;
  }

  .section-title{
    font-size:19px;font-weight:800;margin:26px 2px 12px;
    display:flex;align-items:baseline;gap:8px;
  }
  .section-title span.sub{font-size:12px;font-weight:400;color:var(--muted);}

  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(min-width:640px){.cats{grid-template-columns:repeat(5,1fr);}}
  .cat-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 8px 12px;
    text-align:center;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
    position:relative;
  }
  .cat-card:hover{transform:translateY(-3px);border-color:var(--gold);}
  .cat-card.disabled{opacity:.55;cursor:default;}
  .cat-card.disabled:hover{transform:none;border-color:var(--line);}
  .cat-icon{font-size:26px;margin-bottom:8px;}
  .cat-icon img{width:36px;height:36px;object-fit:contain;border-radius:10px;}
  .cat-label{font-size:13px;font-weight:700;}
  .cat-count{font-size:10px;color:var(--muted);margin-top:2px;}
  .soon-badge{
    position:absolute;top:-8px;left:50%;transform:translateX(50%);
    background:var(--gold);color:#4A2E06;font-size:9px;font-weight:700;
    padding:2px 8px;border-radius:10px;white-space:nowrap;
  }

  .shop-list{display:flex;flex-direction:column;gap:12px;}
  .shop-card{
    background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;
    transition:border-color .15s ease;
  }
  .shop-card:hover{border-color:var(--gold);}
  .shop-logo{
    width:56px;height:56px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#fff;
  }
  .shop-info{flex:1;min-width:0;}
  .shop-name{font-weight:700;font-size:15px;}
  .feat-badge{display:inline-block;vertical-align:middle;margin-inline-start:6px;background:linear-gradient(110deg,var(--gold),#FFD58A);color:#4A2E06;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap;}
  .shop-tag{font-size:12px;color:var(--gold-dark);font-weight:500;}
  .shop-addr{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px;}
  .chevron{color:var(--muted);font-size:18px;flex-shrink:0;}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--ink);font-family:inherit;
    font-size:14px;font-weight:500;cursor:pointer;padding:0;margin-bottom:10px;
  }
  .detail-hero{
    background:var(--paper);border-radius:18px;overflow:hidden;
    border:1px solid var(--line);margin-top:-30px;position:relative;z-index:2;
  }
  .detail-body{padding:18px;}
  .detail-top{display:flex;gap:14px;align-items:flex-start;margin-top:-42px;}
  .detail-logo{
    width:76px;height:76px;border-radius:16px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;color:#fff;border:4px solid var(--paper);
  }
  .detail-name{font-size:20px;font-weight:800;margin-top:34px;}
  .detail-tag{font-size:13px;color:var(--gold-dark);font-weight:600;}

  .ticket-divider{display:flex;align-items:center;gap:6px;margin:18px 0;}
  .ticket-divider::before,.ticket-divider::after{content:"";flex:1;border-top:2px dashed var(--line);}
  .ticket-divider .dot{width:6px;height:6px;border-radius:50%;background:var(--line);}

  .info-row{
    display:flex;align-items:center;gap:10px;
    font-size:14px;color:var(--ink);padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .info-row:last-child{border-bottom:none;}
  .info-icon{
    width:30px;height:30px;border-radius:8px;background:var(--cream);
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
  }
  .info-text{flex:1;}
  .info-label{font-size:11px;color:var(--muted);}

  .action-row{display:flex;gap:10px;margin-top:18px;}
  .btn{
    flex:1;border:none;border-radius:12px;padding:13px 10px;
    font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;
  }
  .btn-call{background:var(--red);color:#fff;}
  .btn-whatsapp{background:#25D366;color:#fff;}
  .btn-map{background:var(--paper);color:var(--ink);border:1px solid var(--line);}

  .menu-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;}
  .menu-photo{
    min-width:100px;height:100px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;
  }

  .view{display:none;}
  .view.active{display:block;}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  footer.note{text-align:center;font-size:11px;color:var(--muted);margin-top:20px;padding:0 20px;}

  #intro{
    position:fixed;inset:0;z-index:3000;background:var(--red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    animation:introOut .5s ease forwards;animation-delay:1.1s;
  }
  #intro .intro-mark{
    width:64px;height:64px;border-radius:16px;background:var(--cream);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    animation:introMark .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  #intro .intro-mark img{width:100%;height:100%;object-fit:contain;}
  #intro .intro-name{
    color:#fff;font-size:26px;opacity:0;
    animation:introName .5s ease .35s both;
  }
  @keyframes introMark{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:scale(1);}}
  @keyframes introName{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @keyframes introOut{to{opacity:0;visibility:hidden;}}
  @media (prefers-reduced-motion: reduce){
    #intro{display:none;}
  }


  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.88);
    display:none;align-items:center;justify-content:center;
    z-index:999;padding:20px;
  }
  .lightbox.active{display:flex;}
  .lightbox-img{
    width:min(90vw,420px);height:min(90vw,420px);
    border-radius:20px;display:flex;align-items:center;justify-content:center;
    font-size:90px;color:#fff;
  }
  .lightbox-close{
    position:absolute;top:18px;left:18px;
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);
    color:#fff;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
<body class="lang-ar">
<div id="intro">
  <div class="intro-mark" id="introMark"></div>
  <div class="intro-name display" id="introName">دليلك</div>
</div>
<div class="app">

  <header class="top">
    <div class="top-row">
      <div class="brand" onclick="showHome()" style="cursor:pointer;">
        <div class="brand-mark" id="brandMark"><img src="https://nhtqdfnmdsrhbplfkdey.supabase.co/storage/v1/object/public/shop-images/branding/logo.png" alt="Daleelak logo" style="width:100%;height:100%;object-fit:contain;border-radius:10px;"></div>
        <div>
          <div class="brand-name display" id="brandName">دليلك</div>
          <div class="brand-sub" id="brandSub">دليلك لمحلات الحي</div>
        </div>
      </div>
      <div class="top-controls">
        <div class="area-pill" id="areaPill">📍 النزهة، قباء</div>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>
        <button class="icon-btn" id="langBtn" onclick="toggleLang()" title="Toggle language">EN</button>
        <a class="icon-btn" id="feedbackBox" href="#" target="_blank" rel="noopener" style="text-decoration:none;">💬</a>
      </div>
    </div>
    <div class="search-bar">
      <span>🔍</span>
      <input id="searchInput" type="text" oninput="onSearchInput(this.value)" style="border:none;background:transparent;outline:none;flex:1;font-family:inherit;font-size:14px;color:var(--ink);padding:0;">
    </div>
  </header>

  <div id="view-home" class="view active fade-in">
    <div class="section-title"><span id="sectionsTitle">الأقسام</span> <span class="sub" id="sectionsSub">اختار نوع المحل</span></div>
    <div class="cats" id="catsGrid"></div>

    <div class="section-title"><span id="featuredTitle">مطاعم مقترحة</span> <span class="sub" id="featuredSub">من قسم الفاست فود والأكل الشعبي</span></div>
    <div class="shop-list" id="featuredList"></div>
  </div>

  <div id="view-list" class="view">
    <div class="section-title">
      <button onclick="showHome()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink);">←</button>
      <span id="listTitle">مطاعم</span>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>

  <div id="view-detail" class="view">
    <div id="detailContent"></div>
  </div>

  <footer class="note" id="footerNote">دليلك — دليل مجاني لمحلات النزهة وقباء. التواصل والطلب بيتم مباشرة مع المحل.</footer>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>
  <div class="lightbox-img" id="lightboxImg"></div>
</div>

<script>
const FEEDBACK_WHATSAPP = '201022097217';
let LANG = 'ar';
let THEME = 'light';
let currentView = 'home';

const I18N = {
  ar:{
    brandName:'دليلك', brandSub:'دليلك لمحلات الحي', area:'📍 النزهة، قباء',
    search:'دور على محل، مطعم، أو أكلة...',
    sectionsTitle:'الأقسام', sectionsSub:'اختار نوع المحل',
    featuredTitle:'محلات الحي', featuredSub:'المميزة أولًا', featuredBadge:'مميز',
    shopsCount:'محل', comingSoon:'قريبًا', back:'→ رجوع',
    addressLabel:'العنوان', phoneLabel:'تليفون',
    call:'📞 اتصال', whatsapp:'💬 واتساب', map:'🗺️ الموقع',
    searchResultsFor:'نتايج البحث عن', noResults:'مفيش نتايج',
    footer:'دليلك — دليل مجاني لمحلات النزهة وقباء. التواصل والطلب بيتم مباشرة مع المحل.',
    feedbackTitle:'رأيك يهمّنا', feedbackMsg:'مرحبًا، عندي اقتراح/شكوى بخصوص تطبيق دليلك: '
  },
  en:{
    brandName:'Daleelak', brandSub:'Your neighborhood shop guide', area:'📍 Nozha, Qubaa',
    search:'Search for a shop, restaurant, or dish...',
    sectionsTitle:'Categories', sectionsSub:'Pick a shop type',
    featuredTitle:'Neighborhood shops', featuredSub:'Featured first', featuredBadge:'Featured',
    shopsCount:'shops', comingSoon:'Soon', back:'← Back',
    addressLabel:'Address', phoneLabel:'Phone',
    call:'📞 Call', whatsapp:'💬 WhatsApp', map:'🗺️ Location',
    searchResultsFor:'Results for', noResults:'No results found',
    footer:'Daleelak — a free directory for Nozha and Qubaa shops. Contact and ordering happens directly with the shop.',
    feedbackTitle:'We\'d love your feedback', feedbackMsg:'Hi, I have a suggestion/complaint about the Daleelak app: '
  }
};

const SUPABASE_URL = 'https://nhtqdfnmdsrhbplfkdey.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_eFAzBTqbatLmZrUdkVWg9g_zk8bMcFD';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let CATS = [];
let SHOPS = [];

/* anonymous usage events: no personal data, only what was tapped/searched */
const SESSION_ID = (() => {
  try{
    let s = sessionStorage.getItem('dl_sid');
    if(!s){ s = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem('dl_sid', s); }
    return s;
  }catch(e){ return null; }
})();
function track(type, shopId, query){
  try{ db.from('events').insert({type, shop_id:shopId || null, query:query || null, session:SESSION_ID}).then(() => {}, () => {}); }catch(e){}
}
const viewedShops = new Set();
function trackView(id){ if(viewedShops.has(id)) return; viewedShops.add(id); track('view', id); }
let searchTrackTimer = null, lastTrackedQuery = '';
function trackSearch(){
  clearTimeout(searchTrackTimer);
  const q = searchQuery;
  if(q.length < 2) return;
  searchTrackTimer = setTimeout(() => {
    if(q !== searchQuery || q === lastTrackedQuery) return;
    lastTrackedQuery = q;
    track(SHOPS.some(s => matchesSearch(s, q)) ? 'search' : 'search_empty', null, q);
  }, 900);
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-track]');
  if(a) track(a.dataset.track, lastShopId);
});

async function loadData(){
  const [shopsFirst, catsRes] = await Promise.all([
    db.from('public_shops').select('*').order('created_at'),
    db.from('categories').select('*').order('sort_order')
  ]);
  let shopsRes = shopsFirst;
  // keeps the site working until the public_shops view exists
  if(shopsRes.error) shopsRes = await db.from('shops').select('*').order('created_at');
  if(catsRes.error) console.error(catsRes.error);
  if(shopsRes.error) console.error(shopsRes.error);
  const shops = shopsRes.data, cats = catsRes.data;
  const today = new Date().toISOString().slice(0, 10);

  SHOPS = (shops||[]).map(s => ({
    id:s.id, catId:s.category_id, icon:s.icon, color:s.color, logoUrl:s.logo_url,
    created:s.created_at || '',
    featured: s.is_featured !== undefined ? !!s.is_featured
      : (s.plan === 'lifetime' || (!!s.plan && s.plan !== 'none' && !!s.expiry_date && s.expiry_date >= today)),
    name:{ar:s.name_ar, en:s.name_en || s.name_ar},
    tag:{ar:s.tag || '', en:s.tag || ''},
    address:{ar:s.address || '', en:s.address || ''},
    phone:s.phone, whatsapp:s.whatsapp || s.phone,
    mapUrl:s.map_url || '#', menu:(s.menu_images && s.menu_images.length) ? s.menu_images : ['🏪']
  }));
  // paying shops first; inside each group keep the order they were added
  SHOPS.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
  CATS = (cats||[]).map(c => ({
    id:c.id, icon:c.icon, imageUrl:c.image_url, label:{ar:c.label,en:c.label},
    active: SHOPS.some(s=>s.catId===c.id)
  }));
}

function isImageUrl(v){ return !!v && /^https?:\/\//.test(v); }
function logoInner(s){ return isImageUrl(s.logoUrl) ? `<img src="${s.logoUrl}" style="width:100%;height:100%;object-fit:contain;">` : s.icon; }

function t(key){ return I18N[LANG][key]; }

function applyStaticText(){
  document.getElementById('brandName').textContent = t('brandName');
  document.getElementById('brandSub').textContent = t('brandSub');
  document.getElementById('areaPill').textContent = t('area');
  document.getElementById('searchInput').placeholder = t('search');
  document.getElementById('sectionsTitle').textContent = t('sectionsTitle');
  document.getElementById('sectionsSub').textContent = t('sectionsSub');
  document.getElementById('featuredTitle').textContent = t('featuredTitle');
  document.getElementById('featuredSub').textContent = t('featuredSub');
  document.getElementById('footerNote').textContent = t('footer');
  const feedbackBtn = document.getElementById('feedbackBox');
  feedbackBtn.title = t('feedbackTitle');
  feedbackBtn.href = `https://wa.me/${FEEDBACK_WHATSAPP}?text=${encodeURIComponent(t('feedbackMsg'))}`;
  document.getElementById('langBtn').textContent = LANG === 'ar' ? 'EN' : 'ع';
  document.getElementById('themeBtn').textContent = THEME === 'light' ? '🌙' : '☀️';
}

function renderCats(){
  document.getElementById('catsGrid').innerHTML = CATS.map(c => `
    <div class="cat-card ${c.active?'':'disabled'}" onclick="${c.active?`openCategory('${c.id}')`:''}">
      ${!c.active?`<div class="soon-badge">${t('comingSoon')}</div>`:''}
      <div class="cat-icon">${isImageUrl(c.imageUrl) ? `<img src="${c.imageUrl}" alt="">` : c.icon}</div>
      <div class="cat-label">${c.label[LANG]}</div>
      <div class="cat-count">${c.active ? SHOPS.filter(s=>s.catId===c.id).length+' '+t('shopsCount') : '—'}</div>
    </div>
  `).join('');
}

function shopCardHTML(s){
  return `
    <div class="shop-card" onclick="openShop('${s.id}')">
      <div class="shop-logo" style="background:${s.color};overflow:hidden;">${logoInner(s)}</div>
      <div class="shop-info">
        <div class="shop-name">${s.name[LANG]}${s.featured ? ` <span class="feat-badge">⭐ ${t('featuredBadge')}</span>` : ''}</div>
        <div class="shop-tag">${s.tag[LANG]}</div>
        <div class="shop-addr">📍 ${s.address[LANG]}</div>
      </div>
      <div class="chevron">‹</div>
    </div>
  `;
}

function renderFeatured(){
  // paying shops first (they carry the badge), then the newest ones
  const newest = SHOPS.filter(s => !s.featured).sort((a, b) => b.created.localeCompare(a.created));
  const list = SHOPS.filter(s => s.featured).concat(newest).slice(0, 4);
  document.getElementById('featuredList').innerHTML = list.map(shopCardHTML).join('');
}

let currentCatId = 'food';
let searchQuery = '';
let lastListContext = {type:'category', id:'food'};

function matchesSearch(s, q){
  const hay = [s.name[LANG], s.tag[LANG], s.address[LANG]].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}

function renderShopList(){
  const listTitle = document.getElementById('listTitle');
  let shops;
  if(searchQuery){
    listTitle.textContent = `${t('searchResultsFor')} "${searchQuery}"`;
    shops = SHOPS.filter(s=>matchesSearch(s, searchQuery));
  } else {
    const cat = CATS.find(c=>c.id===currentCatId);
    listTitle.textContent = cat ? cat.label[LANG] : '';
    shops = SHOPS.filter(s=>s.catId===currentCatId);
  }
  document.getElementById('shopList').innerHTML = shops.length
    ? shops.map(shopCardHTML).join('')
    : `<div style="text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;">${t('noResults')}</div>`;
  if(searchQuery) trackSearch();
}

function showHome(){
  currentView = 'home';
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-home').classList.add('active','fade-in');
}

function openCategory(catId){
  currentView = 'list';
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  currentCatId = catId;
  lastListContext = {type:'category', id:catId};
  renderShopList();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-list').classList.add('active','fade-in');
}

function onSearchInput(value){
  searchQuery = value.trim();
  if(!searchQuery){
    if(currentView === 'list' && lastListContext.type === 'search') showHome();
    return;
  }
  currentView = 'list';
  lastListContext = {type:'search'};
  renderShopList();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-list').classList.add('active','fade-in');
}

function renderShopDetail(id){
  const s = SHOPS.find(x=>x.id===id);
  document.getElementById('detailContent').innerHTML = `
    <button class="back-btn" style="margin:8px 0 -30px;" onclick="goBackFromDetail()">${t('back')}</button>
    <div style="height:60px;background:${s.color};border-radius:18px 18px 0 0;margin-top:8px;"></div>
    <div class="detail-hero">
      <div class="detail-body">
        <div class="detail-top">
          <div class="detail-logo" style="background:${s.color};overflow:hidden;">${logoInner(s)}</div>
          <div>
            <div class="detail-name">${s.name[LANG]}${s.featured ? ` <span class="feat-badge">⭐ ${t('featuredBadge')}</span>` : ''}</div>
            <div class="detail-tag">${s.tag[LANG]}</div>
          </div>
        </div>
        <div class="ticket-divider"><span class="dot"></span></div>
        <div class="menu-strip">
          ${s.menu.map(m=>isImageUrl(m)
            ? `<div class="menu-photo" style="background:${s.color};overflow:hidden;padding:0;" onclick="openLightbox('${m}','${s.color}')"><img src="${m}" style="width:100%;height:100%;object-fit:cover;"></div>`
            : `<div class="menu-photo" style="background:${s.color}" onclick="openLightbox('${m}','${s.color}')">${m}</div>`
          ).join('')}
        </div>
        <div class="ticket-divider"><span class="dot"></span></div>
        <div class="info-row">
          <div class="info-icon">📍</div>
          <div class="info-text"><div class="info-label">${t('addressLabel')}</div>${s.address[LANG]}</div>
        </div>
        <div class="info-row">
          <div class="info-icon">📞</div>
          <div class="info-text"><div class="info-label">${t('phoneLabel')}</div>${s.phone}</div>
        </div>
        <div class="action-row">
          <a class="btn btn-call" data-track="call" href="tel:${s.phone}">${t('call')}</a>
          <a class="btn btn-whatsapp" data-track="whatsapp" href="https://wa.me/${s.whatsapp}" target="_blank">${t('whatsapp')}</a>
          <a class="btn btn-map" data-track="map" href="${s.mapUrl}" target="_blank">${t('map')}</a>
        </div>
      </div>
    </div>
  `;
}

function goBackFromDetail(){
  if(lastListContext.type === 'search'){
    currentView = 'list';
    renderShopList();
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-list').classList.add('active','fade-in');
  } else {
    openCategory(lastListContext.id);
  }
}

let lastShopId = null;
function openShop(id){
  currentView = 'detail';
  lastShopId = id;
  trackView(id);
  renderShopDetail(id);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-detail').classList.add('active','fade-in');
}

function renderAll(){
  applyStaticText();
  renderCats();
  renderFeatured();
  if(currentView === 'list') renderShopList();
  if(currentView === 'detail' && lastShopId) renderShopDetail(lastShopId);
}

function toggleTheme(){
  THEME = THEME === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', THEME);
  applyStaticText();
}

function toggleLang(){
  LANG = LANG === 'ar' ? 'en' : 'ar';
  document.documentElement.setAttribute('lang', LANG);
  document.documentElement.setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
  document.body.classList.toggle('lang-en', LANG === 'en');
  document.body.classList.toggle('lang-ar', LANG === 'ar');
  renderAll();
}

function openLightbox(content,color){
  const box = document.getElementById('lightboxImg');
  if(isImageUrl(content)){
    box.innerHTML = `<img src="${content}" style="width:100%;height:100%;object-fit:contain;border-radius:20px;">`;
  } else {
    box.textContent = content;
  }
  box.style.background = color;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox(e){
  if(e) e.stopPropagation();
  document.getElementById('lightbox').classList.remove('active');
}

loadData().then(renderAll);

const introEl = document.getElementById('intro');
const headerLogo = document.querySelector('#brandMark img');
if(headerLogo){
  document.getElementById('introMark').innerHTML = `<img src="${headerLogo.src}" alt="Daleelak logo" style="width:100%;height:100%;object-fit:contain;">`;
}
setTimeout(()=>{ if(introEl) introEl.remove(); }, 1700);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

</script>

</body>
</html>
