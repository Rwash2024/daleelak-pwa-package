<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دليلك — دليل محلات النزهة وقباء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D93829">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دليلك">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&family=Fredoka:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#FBF1E4;
    --paper:#FFFFFF;
    --red:#D93829;
    --red-dark:#A82B1F;
    --ink:#2B211B;
    --gold:#E8A33D;
    --gold-dark:#B87A22;
    --muted:#8C7A6B;
    --line:#E9DDC8;
    --glass:rgba(255,255,255,.95);
    --shadow-sm:0 2px 10px rgba(43,33,27,.06);
    --shadow-md:0 14px 30px -12px rgba(43,33,27,.28);
    --skel-a:#EFE3D0;
    --skel-b:#F8EFE2;
    --ease:cubic-bezier(.22,1,.36,1);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --sx:1;
    --sy:0;
  }
  html[dir="rtl"]{--sx:-1;}
  [data-theme="dark"]{
    --cream:#1C1712;
    --paper:#262019;
    --red:#E2483C;
    --red-dark:#F06B5E;
    --ink:#F3E9DC;
    --gold:#F0B559;
    --gold-dark:#F5C578;
    --muted:#A89685;
    --line:#3B3225;
    --glass:rgba(38,32,25,.95);
    --shadow-sm:0 2px 10px rgba(0,0,0,.35);
    --shadow-md:0 14px 30px -12px rgba(0,0,0,.7);
    --skel-a:#30281e;
    --skel-b:#3a3125;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 12% 0%, rgba(232,163,61,.14), transparent 38%),
      radial-gradient(circle at 92% 26%, rgba(217,56,41,.08), transparent 42%);
    background-attachment:fixed;
    font-family:'Tajawal',sans-serif;
    color:var(--ink);
    min-height:100vh;
    transition:background-color .3s ease, color .3s ease;
  }
  body.lang-en{font-family:'Poppins',sans-serif;}
  body.lb-open{overflow:hidden;}
  .display{font-family:'Lalezar',sans-serif;}
  body.lang-en .display{font-family:'Fredoka',sans-serif;}
  .app{max-width:1100px;margin:0 auto;padding:0 16px 56px;}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px;}
  mark{background:rgba(232,163,61,.35);color:inherit;border-radius:4px;padding:0 2px;}

  /* ---------- ripple ---------- */
  .rip{position:relative;overflow:hidden;}
  .ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:ripple .65s ease-out;pointer-events:none;}
  @keyframes ripple{to{transform:scale(1);opacity:0;}}

  /* ---------- reveal ---------- */
  .reveal:not(.in){opacity:0;}
  .reveal.in{animation:rise .65s var(--ease) backwards;animation-delay:calc(var(--i,0) * 55ms);}
  .reveal.in.fast{animation-duration:.28s;animation-delay:0s;}
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96);}to{opacity:1;transform:none;}}

  /* ---------- header ---------- */
  header.top{
    background:linear-gradient(155deg,#E9503F 0%,var(--red) 48%,#B52D21 100%);
    color:#fff;
    padding:18px 16px 62px;
    border-radius:0 0 30px 30px;
    position:relative;
    overflow:hidden;
    view-transition-name:hdr;
  }
  header.top::after{
    content:"";
    position:absolute;
    bottom:0;left:0;right:0;
    height:10px;
    background-image:radial-gradient(circle, var(--cream) 5px, transparent 5.5px);
    background-size:22px 20px;
    background-position:0 -6px;
  }
  .blob{position:absolute;border-radius:50%;filter:blur(34px);opacity:.38;pointer-events:none;animation:drift 11s ease-in-out infinite;}
  .blob.b1{width:190px;height:190px;background:#FFB347;top:-70px;inset-inline-start:-40px;}
  .blob.b2{width:230px;height:230px;background:#FF6B57;bottom:-110px;inset-inline-end:-50px;animation-delay:-5s;}
  .fx{position:absolute;font-size:30px;opacity:.14;pointer-events:none;animation:floaty 7s ease-in-out infinite;user-select:none;}
  .fx.f1{top:18%;inset-inline-start:34%;animation-delay:-1s;}
  .fx.f2{top:52%;inset-inline-start:8%;animation-delay:-3s;font-size:26px;}
  .fx.f3{top:10%;inset-inline-end:30%;animation-delay:-2s;font-size:24px;}
  .fx.f4{top:58%;inset-inline-end:12%;animation-delay:-4.5s;}
  .fx.f5{top:44%;inset-inline-start:52%;animation-delay:-6s;font-size:22px;}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(26px,18px) scale(1.12);}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-14px) rotate(8deg);}}

  .top-row{
    position:relative;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    max-width:1100px;margin:0 auto;gap:10px;
    transform:translateY(calc(var(--sy) * .32px));
    opacity:calc(1 - var(--sy) / 340);
    will-change:transform,opacity;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer;}
  .brand-mark{
    width:46px;height:46px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;overflow:hidden;
    box-shadow:0 8px 18px -6px rgba(0,0,0,.4);
    transition:transform .5s var(--spring);
  }
  .brand:hover .brand-mark{transform:rotate(-8deg) scale(1.08);}
  .brand-mark img{width:100%;height:100%;object-fit:contain;border-radius:10px;}
  .brand-name{font-size:28px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.18);}
  .brand-sub{font-size:11px;opacity:.88;margin-top:3px;}
  .top-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .icon-btn{
    width:38px;height:38px;border-radius:13px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:'Tajawal',sans-serif;font-weight:700;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:transform .3s var(--spring), background .2s ease;
    text-decoration:none;
  }
  .icon-btn:hover{background:rgba(255,255,255,.32);transform:translateY(-2px);}
  .icon-btn:active{transform:scale(.9);}
  .icon-btn .ico{display:inline-block;}
  .icon-btn.spin .ico{animation:spinOnce .6s var(--ease);}
  @keyframes spinOnce{from{transform:rotate(-200deg) scale(.4);}to{transform:none;}}
  .area-pill{
    display:flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.4);
    border-radius:20px;
    padding:7px 13px;
    font-size:12px;font-weight:500;white-space:nowrap;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:#7CFFB2;position:relative;flex-shrink:0;}
  .pulse-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#7CFFB2;animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{from{transform:scale(1);opacity:.7;}to{transform:scale(3.2);opacity:0;}}

  /* ---------- search ---------- */
  .search-wrap{position:sticky;top:10px;z-index:60;margin:-34px 0 0;view-transition-name:srch;}
  .search-bar{
    position:relative;
    display:flex;align-items:center;gap:10px;
    height:54px;padding:0 14px;
    background:var(--paper);
    border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow-md);
    transition:transform .4s var(--spring), box-shadow .3s ease, border-color .3s ease;
  }
  .search-bar:focus-within{
    transform:translateY(-2px) scale(1.012);
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(232,163,61,.22), var(--shadow-md);
  }
  .s-ico{width:22px;height:22px;color:var(--red);flex-shrink:0;transition:transform .5s var(--spring);}
  .search-bar:focus-within .s-ico{transform:rotate(-12deg) scale(1.15);}
  .s-field{position:relative;flex:1;height:100%;display:flex;align-items:center;min-width:0;}
  .s-field input{
    width:100%;height:100%;border:none;background:transparent;outline:none;
    font-family:inherit;font-size:15px;color:var(--ink);padding:0;
  }
  .ph{
    position:absolute;inset-inline:0;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:.35em;
    color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;
    pointer-events:none;transition:opacity .2s ease;
  }
  .s-field input:not(:placeholder-shown) ~ .ph{opacity:0;}
  .ph-word{color:var(--red);font-weight:800;display:inline-block;transition:opacity .26s ease, transform .26s ease;}
  .ph-word.out{opacity:0;transform:translateY(-9px);}
  .ph-word.in-w{animation:wordIn .38s var(--ease);}
  @keyframes wordIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .s-clear{
    width:28px;height:28px;border-radius:50%;border:none;background:var(--line);color:var(--muted);
    cursor:pointer;font-size:13px;display:none;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .3s var(--spring), background .2s ease;
  }
  .s-clear.show{display:flex;animation:wordIn .3s var(--ease);}
  .s-clear:hover{background:var(--gold);color:#fff;transform:rotate(90deg);}

  /* ---------- titles ---------- */
  .section-title{
    font-size:21px;margin:30px 2px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title::before{
    content:"";width:5px;height:24px;border-radius:4px;flex-shrink:0;
    background:linear-gradient(var(--red),var(--gold));
    animation:grow .6s var(--ease) backwards;
    transform-origin:center;
  }
  @keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  .section-title .sub{font-size:12px;font-weight:400;color:var(--muted);font-family:'Tajawal',sans-serif;}
  body.lang-en .section-title .sub{font-family:'Poppins',sans-serif;}
  .back-circle{
    width:38px;height:38px;border-radius:13px;border:1px solid var(--line);background:var(--paper);
    color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-sm);flex-shrink:0;font-size:16px;font-family:inherit;
    transition:transform .3s var(--spring), border-color .2s ease;
  }
  .back-circle:hover{transform:translateX(calc(var(--sx) * -3px));border-color:var(--gold);}
  .list-title-wrap{display:flex;flex-direction:column;min-width:0;}
  .list-count{font-size:12px;font-weight:400;color:var(--muted);font-family:'Tajawal',sans-serif;}
  body.lang-en .list-count{font-family:'Poppins',sans-serif;}

  /* ---------- categories ---------- */
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(min-width:640px){.cats{grid-template-columns:repeat(5,1fr);gap:14px;}}
  .cat-card{
    --rx:0deg;--ry:0deg;--ty:0px;
    position:relative;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px 8px 13px;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty));
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .3s ease, opacity .3s ease;
  }
  .cat-card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at var(--mx,50%) var(--my,0%), rgba(232,163,61,.32), transparent 58%);
    opacity:0;transition:opacity .3s ease;
  }
  .cat-card.live{border-color:rgba(232,163,61,.6);}
  .cat-card.live:hover{--ty:-5px;box-shadow:var(--shadow-md);border-color:var(--gold);}
  .cat-card.live:hover::before{opacity:1;}
  .cat-card.live:active{transform:scale(.95);}
  .cat-card.soon{cursor:default;}
  .cat-card.soon .cat-icon,.cat-card.soon .cat-label{opacity:.55;filter:grayscale(.55);}
  .live-dot{position:absolute;top:10px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:#2ED47A;}
  .live-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#2ED47A;animation:pulse 1.9s ease-out infinite;}
  .cat-icon{font-size:30px;margin-bottom:8px;height:40px;display:flex;align-items:center;justify-content:center;transition:transform .45s var(--spring);}
  .cat-card.live:hover .cat-icon{transform:translateY(-4px) scale(1.2) rotate(-7deg);}
  .cat-icon img{width:40px;height:40px;object-fit:contain;border-radius:11px;}
  .cat-label{font-size:13px;font-weight:700;line-height:1.35;min-height:2.7em;display:flex;align-items:center;justify-content:center;}
  .cat-count{font-size:10.5px;color:var(--muted);margin-top:3px;}
  .soon-badge{
    position:absolute;top:9px;inset-inline-start:9px;
    background:linear-gradient(110deg,var(--gold) 30%,#FFD58A 50%,var(--gold) 70%);
    background-size:220% 100%;animation:shine 3.2s linear infinite;
    color:#4A2E06;font-size:9px;font-weight:800;
    padding:2px 8px;border-radius:10px;white-space:nowrap;
  }
  @keyframes shine{from{background-position:120% 0;}to{background-position:-120% 0;}}

  /* ---------- shops ---------- */
  .shop-list{display:grid;gap:12px;grid-template-columns:1fr;}
  @media(min-width:760px){.shop-list{grid-template-columns:1fr 1fr;gap:14px;}}
  .shop-card{
    position:relative;
    background:var(--paper);border:1px solid var(--line);border-radius:22px;
    padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .35s var(--ease), box-shadow .35s var(--ease), border-color .3s ease;
  }
  .shop-card::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.5) 50%,transparent 68%);
    transform:translateX(-130%);transition:transform .9s var(--ease);
  }
  [data-theme="dark"] .shop-card::after{background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.07) 50%,transparent 68%);}
  .shop-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--gold);}
  .shop-card:hover::after{transform:translateX(130%);}
  .shop-card:active{transform:scale(.98);}
  .shop-logo{
    width:62px;height:62px;border-radius:18px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:27px;color:#fff;overflow:hidden;
    box-shadow:0 10px 18px -8px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.22);
    transition:transform .45s var(--spring);
  }
  .shop-card:hover .shop-logo{transform:rotate(-6deg) scale(1.08);}
  .shop-logo.has-img{background:#fff !important;padding:5px;}
  .shop-logo img{width:100%;height:100%;object-fit:contain;}
  .shop-info{flex:1;min-width:0;}
  .shop-name{font-weight:800;font-size:16px;line-height:1.3;}
  .feat-badge{display:inline-block;vertical-align:middle;margin-inline-start:6px;background:linear-gradient(110deg,var(--gold),#FFD58A);color:#4A2E06;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap;font-family:'Tajawal',sans-serif;}
  .shop-tag{font-size:12.5px;color:var(--gold-dark);font-weight:600;margin-top:1px;}
  .shop-addr{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:flex-start;gap:4px;line-height:1.45;}
  .open-chip{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap;}
  .open-chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .open-chip.ok{background:rgba(46,125,91,.13);color:#2E7D5B;}
  .open-chip.soon{background:rgba(232,163,61,.2);color:var(--gold-dark);}
  .open-chip.closed{background:rgba(192,57,43,.12);color:#C0392B;}
  [data-theme="dark"] .open-chip.ok{background:rgba(95,214,160,.14);color:#5FD6A0;}
  [data-theme="dark"] .open-chip.closed{background:rgba(255,138,125,.14);color:#FF8A7D;}
  .filter-bar{display:flex;margin:-4px 2px 14px;}
  .filter-bar[hidden]{display:none;}
  .filter-chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);font-family:inherit;font-weight:700;font-size:13px;padding:8px 16px;border-radius:20px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .3s var(--spring), background .2s ease, border-color .2s ease, color .2s ease;}
  .filter-chip{display:inline-flex;align-items:center;}
  .filter-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:#2E7D5B;margin-inline-end:8px;flex-shrink:0;}
  .filter-chip.on::before{background:#fff;}
  .filter-chip:hover{transform:translateY(-2px);}
  .filter-chip:active{transform:scale(.95);}
  .filter-chip.on{background:#2E7D5B;color:#fff;border-color:#2E7D5B;}
  .hours-list{display:none;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;}
  .info-row.open .hours-list{display:block;animation:fadeIn .3s ease;}
  .info-row.open .info-hint{display:none;}
  .hours-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:4px 0;}
  .hours-row.today{font-weight:800;color:var(--red);}
  .hours-row .muted{color:var(--muted);}
  .shop-addr svg{width:13px;height:13px;flex-shrink:0;margin-top:2px;color:var(--red);}
  .chevron{color:var(--muted);flex-shrink:0;transition:transform .35s var(--spring), color .2s ease;display:flex;}
  .chevron svg{width:20px;height:20px;}
  [dir="ltr"] .chevron svg{transform:scaleX(-1);}
  .shop-card:hover .chevron{transform:translateX(calc(var(--sx) * 5px));color:var(--red);}

  /* skeleton */
  .skel{background:linear-gradient(90deg,var(--skel-a) 0%,var(--skel-b) 50%,var(--skel-a) 100%);background-size:220% 100%;animation:skel 1.25s linear infinite;border-radius:10px;}
  @keyframes skel{from{background-position:120% 0;}to{background-position:-120% 0;}}
  .skel-card{pointer-events:none;}
  .sk-ico{width:42px;height:42px;border-radius:14px;margin:0 auto 12px;}
  .sk-line{height:11px;margin:7px auto;width:70%;}
  .sk-logo{width:62px;height:62px;border-radius:18px;flex-shrink:0;}
  .sk-info{flex:1;}
  .sk-info .sk-line{margin:8px 0;}
  .sk-info .w60{width:60%;} .sk-info .w40{width:40%;} .sk-info .w80{width:85%;}

  /* states */
  .state-card{
    grid-column:1/-1;text-align:center;padding:42px 20px;
    background:var(--paper);border:1px dashed var(--line);border-radius:24px;
  }
  .state-emoji{font-size:46px;display:inline-block;animation:floaty 4s ease-in-out infinite;}
  .state-title{font-size:18px;font-weight:800;margin:10px 0 4px;}
  .state-hint{font-size:13px;color:var(--muted);margin-bottom:16px;}
  .state-btn{
    display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;
    background:var(--red);color:#fff;font-family:inherit;font-weight:700;font-size:14px;
    padding:11px 20px;border-radius:14px;text-decoration:none;
    box-shadow:0 10px 20px -8px rgba(217,56,41,.55);
    transition:transform .3s var(--spring);
  }
  .state-btn:hover{transform:translateY(-2px);}
  .state-btn:active{transform:scale(.95);}

  /* ---------- views ---------- */
  .view{display:none;}
  .view.active{display:block;}
  .vt-fallback .view.active{animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  ::view-transition-old(root),::view-transition-new(root){animation-duration:.4s;animation-timing-function:var(--ease);}
  html[data-vt="forward"]::view-transition-old(root){animation-name:vtOutF;}
  html[data-vt="forward"]::view-transition-new(root){animation-name:vtInF;}
  html[data-vt="back"]::view-transition-old(root){animation-name:vtOutB;}
  html[data-vt="back"]::view-transition-new(root){animation-name:vtInB;}
  @keyframes vtInF{from{opacity:0;transform:translateX(calc(var(--sx) * 48px));}}
  @keyframes vtOutF{to{opacity:0;transform:translateX(calc(var(--sx) * -48px));}}
  @keyframes vtInB{from{opacity:0;transform:translateX(calc(var(--sx) * -48px));}}
  @keyframes vtOutB{to{opacity:0;transform:translateX(calc(var(--sx) * 48px));}}
  /* header + search stay put and live during page transitions (no ghosting) */

function copyText(text, msg){

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();

async function loadData(){
  loading = true; loadFailed = false;
  try{
    let [c, s] = await Promise.all([
      db.from('categories').select('*').order('sort_order'),
      db.from('public_shops').select('*').order('created_at')
    ]);
    // keeps the site working until the public_shops view exists
    if(s.error) s = await db.from('shops').select('*').order('created_at');
    if(c.error || s.error) throw (c.error || s.error);
    const today = new Date().toISOString().slice(0, 10);
    SHOPS = (s.data || []).map(x => ({
      id:x.id, catId:x.category_id, icon:x.icon || '🏪', color:x.color || '#D93829', logoUrl:x.logo_url,
      created:x.created_at || '',
      featured: x.is_featured !== undefined ? !!x.is_featured
        : (x.plan === 'lifetime' || (!!x.plan && x.plan !== 'none' && !!x.expiry_date && x.expiry_date >= today)),
      name:{ar:x.name_ar, en:x.name_en || x.name_ar},
      tag:{ar:x.tag || '', en:x.tag || ''},
      address:{ar:x.address || '', en:x.address || ''},
      phone:x.phone || '', whatsapp:x.whatsapp || x.phone || '',
      mapUrl:x.map_url || '', menu:Array.isArray(x.menu_images) ? x.menu_images.filter(Boolean) : [],
      hours:(x.hours && typeof x.hours === 'object') ? x.hours : null,
      kind:x.kind === 'service' ? 'service' : 'shop', serviceType:x.service_type || '', area:x.area || '', vehicle:x.vehicle || '', verified:!!x.verified
    }));
    // paying shops first; inside each group keep the order they were added
    SHOPS.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    CATS = (c.data || []).map(x => ({
      id:x.id, icon:x.icon, imageUrl:x.image_url, label:{ar:x.label, en:x.label},
      active:SHOPS.some(sh => sh.catId === x.id)
    }));
  }catch(e){
    console.error(e);
    loadFailed = true;
  }
  loading = false;
}

const io = 'IntersectionObserver' in window
  ? new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, {threshold:.06, rootMargin:'0px 0px -3% 0px'})
  : null;
function observeReveals(scope){
  (scope || document).querySelectorAll('.reveal:not(.in)').forEach(el => io ? io.observe(el) : el.classList.add('in'));
}
function forceReveals(scope){
  scope.querySelectorAll('.reveal:not(.in)').forEach(el => el.classList.add('in'));
}

document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.rip');
  if(!el || reduceMotion) return;
  const r = el.getBoundingClientRect();
  const d = Math.max(r.width, r.height) * 2;
  const sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d/2}px;top:${e.clientY - r.top - d/2}px`;
  el.appendChild(sp);
  sp.addEventListener('animationend', () => sp.remove());
  if(navigator.vibrate && e.pointerType === 'touch') navigator.vibrate(6);
});

document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')){
    e.preventDefault(); e.target.click();
  }
  if($('lightbox').classList.contains('active')){
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') lbMove(-1);
    if(e.key === 'ArrowRight') lbMove(1);
  }
});

function animateCounts(){
  document.querySelectorAll('.count[data-to]').forEach(el => {
    const to = +el.dataset.to;
    if(reduceMotion || to <= 1){ el.textContent = to; return; }
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if(p < 1) requestAnimationFrame(step);
    };
    el.textContent = 0;
    requestAnimationFrame(step);
  });
}

function bindTilt(){
  if(!canHover || reduceMotion) return;
  document.querySelectorAll('.cat-card.live').forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      card.style.setProperty('--ry', ((x - .5) * 12) + 'deg');
      card.style.setProperty('--rx', ((.5 - y) * 12) + 'deg');
      card.style.setProperty('--mx', (x * 100) + '%');
      card.style.setProperty('--my', (y * 100) + '%');
    });
    card.addEventListener('pointerleave', () => {
      card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg');
    });
  });
}

         </div>`
      : `<div class="cat-card soon reveal" style="--i:${Math.min(i,12)}">

/* =========================================================
   opening hours (always evaluated in Cairo time, whatever the visitor's device says)
   ========================================================= */
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5];   // Egypt's week starts on Saturday
const hhmm = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };

function cairoNow(){
  const parts = new Intl.DateTimeFormat('en-US', {timeZone:'Africa/Cairo', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date());
  const get = type => (parts.find(x => x.type === type) || {}).value;
  const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(get('weekday'));
  return {day: day < 0 ? 0 : day, min: (+get('hour')) * 60 + (+get('minute'))};
}

function fmtTime(s){
  const m = hhmm(s);
  if(m === null) return '';
  const h24 = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0'), h12 = h24 % 12 || 12;
  const suffix = LANG === 'ar' ? (h24 < 12 ? 'ص' : 'م') : (h24 < 12 ? 'AM' : 'PM');
  return `${h12}:${mm} ${suffix}`;
}

function daySched(hours, day){
  if(hours.mode === 'daily') return {open:hours.open, close:hours.close};
  if(hours.mode === 'custom') return (hours.days && hours.days[DAY_KEYS[day]]) || null;
  return null;
}

/* -> null when unknown, else {open, always, closesAt, closesIn, opensAt, dayOffset, opensDay} */
function hoursStatus(hours){
  if(!hours || !hours.mode) return null;
  if(hours.mode === '24h') return {open:true, always:true};
  const now = cairoNow();

  const today = daySched(hours, now.day);
  if(today){
    const o = hhmm(today.open), c = hhmm(today.close);
    if(o !== null && c !== null){
      if(o === c) return {open:true, always:true};
      if(o < c && now.min >= o && now.min < c) return {open:true, closesAt:today.close, closesIn:c - now.min};
      if(o > c && now.min >= o) return {open:true, closesAt:today.close, closesIn:c + 1440 - now.min};   // after-midnight closing
    }
  }
  // still inside yesterday's after-midnight window?
  const yest = daySched(hours, (now.day + 6) % 7);
  if(yest){
    const o = hhmm(yest.open), c = hhmm(yest.close);
    if(o !== null && c !== null && o > c && now.min < c) return {open:true, closesAt:yest.close, closesIn:c - now.min};
  }
  // closed: find the next opening
  for(let i = 0; i < 8; i++){
    const d = (now.day + i) % 7, sc = daySched(hours, d);
    if(!sc) continue;
    const o = hhmm(sc.open);
    if(o === null) continue;
    if(i === 0 && o <= now.min) continue;
    return {open:false, opensAt:sc.open, dayOffset:i, opensDay:d};
  }
  return {open:false};
}

/* what to show on a card: {open, cls, text} or null when the shop gave no hours */
function openChip(s){
  const st = hoursStatus(s.hours);
  if(!st) return null;
  const sv = isSvc(s);   // people say "available", shops say "open"
  if(st.always) return {open:true, cls:'ok', text:t(sv ? 'avail24' : 'open24')};
  if(st.open){
    if(st.closesIn <= 60) return {open:true, cls:'soon', text:`${t(sv ? 'availSoon' : 'closesSoon')} ${st.closesIn} ${t('minShort')}`};
    return {open:true, cls:'ok', text:`${t(sv ? 'availNow' : 'openNow')} · ${t(sv ? 'availUntil' : 'closesAt')} ${fmtTime(st.closesAt)}`};
  }
  if(!st.opensAt) return {open:false, cls:'closed', text:t(sv ? 'unavailNow' : 'closedNow')};
  const when = st.dayOffset === 0 ? t(sv ? 'availToday' : 'opensToday')
             : st.dayOffset === 1 ? t(sv ? 'availTomorrow' : 'opensTomorrow')
             : `${t(sv ? 'availOn' : 'opens')} ${t('dayNames')[st.opensDay]}`;
  return {open:false, cls:'closed', text:`${t(sv ? 'unavailNow' : 'closedNow')} · ${when} ${fmtTime(st.opensAt)}`};
}

function openChipHTML(s){
  const c = openChip(s);
  return c ? `<div class="open-chip ${c.cls}" data-shop="${esc(s.id)}"><i></i>${esc(c.text)}</div>` : '';
}

function weekRowsHTML(s){
  const h = s.hours, today = cairoNow().day;
  if(h.mode === '24h') return `<div class="hours-row"><span>${t('allDay24')}</span></div>`;
  return WEEK_ORDER.map(d => {
    const sc = daySched(h, d);
    const ok = sc && hhmm(sc.open) !== null && hhmm(sc.close) !== null;
    const val = ok ? `<span>${fmtTime(sc.open)} – ${fmtTime(sc.close)}</span>` : `<span class="muted">${t('closedDay')}</span>`;
    return `<div class="hours-row${d === today ? ' today' : ''}"><span>${t('dayNames')[d]}${d === today ? ` (${t('todayLabel')})` : ''}</span>${val}</div>`;
  }).join('');
}

let onlyOpen = false;
function refreshOpenChips(){
  document.querySelectorAll('.open-chip[data-shop]').forEach(el => {
    const s = SHOPS.find(x => x.id === el.dataset.shop);
    const c = s && openChip(s);
    if(!c){ el.remove(); return; }
    el.className = 'open-chip ' + c.cls;
    el.innerHTML = '<i></i>' + esc(c.text);
  });
  if(onlyOpen && currentView === 'list') renderShopList({fast:true});
}

const SVC_TYPES = ['delivery', 'tuktuk', 'car', 'cargo', 'other'];
const isSvc = s => s.kind === 'service';
function lucideSvg(inner, sw){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 2}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

/* uploaded image wins; then the coloured Lucide glyph; custom categories fall back to their emoji */
function catIconHTML(c){
  if(isImageUrl(c.imageUrl)) return `<img src="${esc(c.imageUrl)}" alt="">`;
  const d = CAT_ICONS[c.id];
  return d ? `<span class="cat-glyph" style="--ic:${d.c}">${lucideSvg(d.p, 1.8)}</span>` : esc(c.icon);
}
function catCountLabel(catId){
  const list = SHOPS.filter(s => s.catId === catId);

const svcTypeLabel = k => (k && t('svc_' + k)) || '';

function verifiedBadgeHTML(s){

function shopCardHTML(s, i, opts){
  opts = opts || {};
  const q = opts.q || '';
  const sv = isSvc(s);
  const where = sv
    ? svcTypeChipHTML(s) + (s.area ? `<div class="shop-addr">${ICON.pin}<span>${hl(s.area, q)}</span></div>` : '')
    : `<div class="shop-addr">${ICON.pin}<span>${hl(s.address[LANG], q)}</span></div>`;
  return `
    <div class="shop-card${sv ? ' svc' : ''} rip reveal${opts.fast ? ' in fast' : ''}" style="--i:${Math.min(i,10)}" role="button" tabindex="0" onclick="openShop('${esc(s.id)}')">
      ${logoTile(s, 'shop-logo' + (sv ? ' avatar' : ''))}
      <div class="shop-info">
        <div class="shop-name">${hl(s.name[LANG], q)}${s.featured ? ` <span class="feat-badge">⭐ ${t('featuredBadge')}</span>` : ''}${verifiedBadgeHTML(s)}</div>
        <div class="shop-tag">${hl(s.tag[LANG], q)}</div>
        ${where}
        ${openChipHTML(s)}
      </div>
      <div class="chevron">${ICON.chevron}</div>
    </div>`;
}

function renderFeatured(){
  const box = $('featuredList');
  if(loading){ return; }
  if(loadFailed){ box.innerHTML = ''; return; }
  // paying shops first (they carry the badge), then the newest ones
  const only = SHOPS.filter(s => !isSvc(s));
  const newest = only.filter(s => !s.featured).sort((a, b) => b.created.localeCompare(a.created));
  const list = only.filter(s => s.featured).concat(newest).slice(0, 4);
  box.innerHTML = list.map((s, i) => shopCardHTML(s, i)).join('');
  observeReveals(box);
}

}

let svcTypeFilter = 'all';
function renderShopList(opts){
  opts = opts || {};
  const title = $('listTitle'), count = $('listCount'), box = $('shopList');
  let shops;
  if(searchQuery){
    title.textContent = `${t('searchResultsFor')} "${searchQuery}"`;
    const q = searchQuery.toLowerCase();
    shops = SHOPS.filter(s => [s.name[LANG], s.tag[LANG], s.address[LANG], s.area, s.vehicle, isSvc(s) ? svcTypeLabel(s.serviceType) : ''].join(' ').toLowerCase().includes(q));
  } else {
    const cat = CATS.find(c => c.id === currentCatId);
    title.textContent = cat ? cat.label[LANG] : '';
    shops = SHOPS.filter(s => s.catId === currentCatId);
  }
  const allSvc = shops.length > 0 && shops.every(isSvc);

  // type chips (Delivery / Tuk-tuk / Taxi ...) when browsing a list made of providers
  const sf = $('svcFilter');
  const types = allSvc && !searchQuery ? SVC_TYPES.filter(k => shops.some(s => s.serviceType === k)) : [];
  if(svcTypeFilter !== 'all' && !types.includes(svcTypeFilter)) svcTypeFilter = 'all';
  sf.hidden = types.length < 2;
  if(!sf.hidden){
    sf.innerHTML = [['all', t('filterAll')]].concat(types.map(k => [k, svcTypeLabel(k)]))
      .map(([k, label]) => `<button type="button" class="${svcTypeFilter === k ? 'on' : ''}" data-k="${k}">${esc(label)}</button>`).join('');
    if(svcTypeFilter !== 'all') shops = shops.filter(s => s.serviceType === svcTypeFilter);
  }

  // "open now" / "available now" filter: only when somebody in this list has hours
  $('filterBar').hidden = !shops.some(s => s.hours);
  if($('filterBar').hidden) onlyOpen = false;
  const fbtn = $('openFilter');
  fbtn.textContent = t(allSvc ? 'filterAvail' : 'filterOpen');
  fbtn.classList.toggle('on', onlyOpen);
  if(onlyOpen) shops = shops.filter(s => { const st = hoursStatus(s.hours); return !!(st && st.open); });

  count.textContent = shops.length ? `${shops.length} ${searchQuery ? t('resultsCount') : (allSvc ? t('providersCount') : t('shopsCount'))}` : '';
  box.innerHTML = shops.length
    ? shops.map((s, i) => shopCardHTML(s, i, {q:searchQuery, fast:opts.fast})).join('')
    : (onlyOpen
        ? `<div class="state-card"><div class="state-emoji">🌙</div><div class="state-title">${t(allSvc ? 'noAvailNow' : 'noOpenNow')}</div><div class="state-hint">${t(allSvc ? 'noAvailNowHint' : 'noOpenNowHint')}</div></div>`
        : noResultsHTML());
  observeReveals(box);
  if(searchQuery) trackSearch();
}

function renderShopDetail(id){
  const s = SHOPS.find(x => x.id === id);
  if(!s){ $('detailContent').innerHTML = noResultsHTML(); return; }
  lbItems = s.menu.slice();
  lbColor = s.color;
  const c = esc(s.color);
  const dark = `color-mix(in srgb, ${c} 58%, #000)`;

/* =========================================================
   navigation (history + view transitions)
   ========================================================= */
function transition(kind, fn){
  if(!hasVT){ fn(); return; }
  let ran = false;
  const run = () => { if(ran) return; ran = true; fn(); };
  root.dataset.vt = kind;
  const vt = document.startViewTransition(run);
  // never let a stalled transition freeze the UI (e.g. background tab)
  const guard = setTimeout(run, 350);
  vt.ready.catch(() => {});
  vt.finished.catch(() => {}).finally(() => { clearTimeout(guard); delete root.dataset.vt; });
}

function setActiveView(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  document.body.classList.toggle('in-detail', id === 'view-detail');
  const v = $(id);
  if(v) forceReveals(v);
}

function applyState(s){
  if(s.v === 'cat'){
    currentView = 'list'; searchQuery = ''; $('searchInput').value = ''; updateClear();
    currentCatId = s.id; lastListContext = {type:'category', id:s.id}; svcTypeFilter = 'all';
    renderShopList(); return 'view-list';
  }
  if(s.v === 'search'){
    currentView = 'list'; searchQuery = s.q; $('searchInput').value = s.q; updateClear();
    lastListContext = {type:'search'};
    renderShopList(); return 'view-list';
  }
  if(s.v === 'shop'){
    currentView = 'detail'; currentShopId = s.id;
    trackView(s.id);
    renderShopDetail(s.id); return 'view-detail';
  }
  currentView = 'home'; searchQuery = ''; $('searchInput').value = ''; updateClear();
  return 'view-home';
}

function urlFor(s){
  const base = location.pathname + location.search;
  if(s.v === 'shop') return base + '#shop=' + encodeURIComponent(s.id);
  if(s.v === 'cat') return base + '#cat=' + encodeURIComponent(s.id);
  return base;
}

function navigate(state, o){
  o = o || {};
  const mode = o.mode || 'push';
  const dir = o.dir || 'forward';
  const run = () => {
    const id = applyState(state);
    setActiveView(id);
    window.scrollTo(0, 0);
    onScroll();
  };
  transition(dir, run);
  try{
    if(mode === 'push'){ const next = navIdx + 1; history.pushState(Object.assign({idx:next}, state), '', urlFor(state)); navIdx = next; }
    else if(mode === 'replace'){ history.replaceState(Object.assign({idx:navIdx}, state), '', urlFor(state)); }
  }catch(e){}
}

window.addEventListener('popstate', e => {
  const st = e.state || {v:'home', idx:0};
  const dir = (st.idx || 0) < navIdx ? 'back' : 'forward';
  navIdx = st.idx || 0;
  transition(dir, () => {
    const id = applyState(st);
    setActiveView(id);
    window.scrollTo(0, 0);
  });
});

function showHome(){ navigate({v:'home'}, {dir:'back'}); }
function openCategory(id){ navigate({v:'cat', id}); }
function openShop(id){ navigate({v:'shop', id}); }
function goBack(){
  if(navIdx > 0){ history.back(); return; }
  if(currentView === 'detail'){
    const s = SHOPS.find(x => x.id === currentShopId);
    navigate(s ? {v:'cat', id:s.catId} : {v:'home'}, {mode:'replace', dir:'back'});
  } else navigate({v:'home'}, {mode:'replace', dir:'back'});
}

function routeFromHash(){
  const h = location.hash || '';
  let m;
  if((m = h.match(/^#shop=(.+)$/)) && SHOPS.some(s => s.id === decodeURIComponent(m[1]))){
    navigate({v:'shop', id:decodeURIComponent(m[1])}, {mode:'replace'});
  } else if((m = h.match(/^#cat=(.+)$/)) && CATS.some(c => c.id === decodeURIComponent(m[1]))){
    navigate({v:'cat', id:decodeURIComponent(m[1])}, {mode:'replace'});
  }
}

async function shareShop(id){
  track('share', id);
  const s = SHOPS.find(x => x.id === id);
  const url = location.origin + location.pathname + '#shop=' + encodeURIComponent(id);
  if(navigator.share && /^https?:/.test(url)){
    try{ await navigator.share({title:s.name[LANG], text:s.name[LANG] + ' — ' + t('brandName'), url}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
  }
  copyText(url, t('linkCopied'));
}

/* =========================================================
   sound: synthesized intro chime (no audio files)
   ========================================================= */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  return audioCtx;
}
/* works on any BaseAudioContext so it can also be rendered offline for testing */
function scheduleChime(ctx, t0, full){
  const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
  const dly = ctx.createDelay(); dly.delayTime.value = 0.2;
  const fb = ctx.createGain(); fb.gain.value = 0.28;
  const wet = ctx.createGain(); wet.gain.value = 0.35;
  dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
  const tone = (freq, at, dur, type, vol) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0 + at);
    g.gain.setValueAtTime(0.0001, t0 + at);
    g.gain.exponentialRampToValueAtTime(vol, t0 + at + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    o.connect(g); g.connect(master); g.connect(dly);
    o.start(t0 + at); o.stop(t0 + at + dur + 0.05);
  };
  if(!full){ // short feedback blip (used when turning sound on)
    tone(659.25, 0, 0.5, 'sine', 0.14);
    tone(987.77, 0.12, 0.7, 'sine', 0.1);
    return 1.0;
  }
  tone(261.63, 0.10, 1.5, 'sine', 0.07);        // soft low pad
  tone(523.25, 0.15, 0.6, 'sine', 0.15);        // logo pop
  tone(659.25, 0.45, 0.6, 'sine', 0.15);        // name
  tone(783.99, 0.75, 0.75, 'sine', 0.15);       // tagline
  tone(1046.5, 1.10, 1.0, 'triangle', 0.09);    // sparkle
  // whoosh for the closing iris
  const len = Math.floor(ctx.sampleRate * 0.6);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(350, t0 + 1.5);
  bp.frequency.exponentialRampToValueAtTime(2600, t0 + 2.1);
  const wg = ctx.createGain();
  wg.gain.setValueAtTime(0.0001, t0 + 1.5);
  wg.gain.exponentialRampToValueAtTime(0.06, t0 + 1.75);
  wg.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
  src.connect(bp); bp.connect(wg); wg.connect(master);
  src.start(t0 + 1.5);
  return 3.4;
}
function playChime(full){
  const ctx = getAudioCtx();
  if(!ctx) return false;
  if(ctx.state === 'suspended') ctx.resume().catch(() => {});
  if(ctx.state !== 'running') return false;
  scheduleChime(ctx, ctx.currentTime + 0.02, full);
  return true;
}
function toggleSound(){
  SOUND = !SOUND;
  store('dl_sound', SOUND ? 'on' : 'off');
  applyStaticText();
  if(SOUND){ playChime(false); } // user gesture, so this is allowed to play
}
/* browsers block sound before the first tap: if blocked, play on the first touch while the intro is still fresh */
function armIntroSound(startedAt){
  if(!SOUND || playChime(true)) return;
  let fired = false;
  const events = ['pointerdown', 'keydown', 'touchstart'];
  const kick = () => {
    if(fired) return; fired = true;
    events.forEach(ev => window.removeEventListener(ev, kick));
    if(SOUND && performance.now() - startedAt < 6000) playChime(true);
  };
  events.forEach(ev => window.addEventListener(ev, kick, {passive:true}));
}

let lbItems = [], lbColor = '#D93829', lbIndex = 0;
function paintLightbox(swap){

  box.style.background = lbColor;
  if(isImageUrl(m)) box.innerHTML = `<img src="${esc(m)}" alt="" style="width:100%;height:100%;object-fit:contain;">`;

  if(swap){ box.classList.remove('swap'); void box.offsetWidth; box.classList.add('swap'); }
}

  lbIndex = i; paintLightbox(false);

}
function closeLightbox(){
  $('lightbox').classList.remove('active');
  document.body.classList.remove('lb-open');
}
/* side: -1 = left button / swipe toward left item, +1 = right */
function lbMove(side){
  if(lbItems.length < 2) return;
  const rtl = root.getAttribute('dir') === 'rtl';
  const delta = side * (rtl ? -1 : 1);
  lbIndex = (lbIndex + delta + lbItems.length) % lbItems.length;
  paintLightbox(true);
}
(function bindLightbox(){
  const lb = $('lightbox');
  lb.addEventListener('click', e => { if(e.target === lb) closeLightbox(); });
  $('lbClose').addEventListener('click', closeLightbox);
  $('lbLeft').addEventListener('click', e => { e.stopPropagation(); lbMove(-1); });
  $('lbRight').addEventListener('click', e => { e.stopPropagation(); lbMove(1); });
  let sx = null;
  lb.addEventListener('pointerdown', e => { sx = e.clientX; });
  lb.addEventListener('pointerup', e => {
    if(sx === null) return;
    const dx = e.clientX - sx; sx = null;
    if(Math.abs(dx) > 50) lbMove(dx > 0 ? -1 : 1);
  });
})();

let ticking = false;
function onScroll(){
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const y = window.scrollY || 0;
    root.style.setProperty('--sy', Math.min(y, 400));
    $('fab').classList.toggle('show', y > 520);
    ticking = false;
  });
}
window.addEventListener('scroll', onScroll, {passive:true});

/* =========================================================
   boot
   ========================================================= */
$('brand').addEventListener('click', () => {
  if(currentView === 'home') window.scrollTo({top:0, behavior:'smooth'});
  else showHome();
});
$('soundBtn').addEventListener('click', toggleSound);
$('themeBtn').addEventListener('click', toggleTheme);
$('langBtn').addEventListener('click', toggleLang);
$('listBack').addEventListener('click', goBack);
$('openFilter').addEventListener('click', () => { onlyOpen = !onlyOpen; renderShopList({fast:true}); });
$('svcFilter').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if(!b) return;
  svcTypeFilter = b.dataset.k;
  renderShopList({fast:true});
});
$('searchInput').addEventListener('input', onSearchInput);
$('sClear').addEventListener('click', clearSearch);
$('feedbackBox').addEventListener('click', e => openSheet(e.currentTarget));
$('supportBtn').addEventListener('click', e => openSheet(e.currentTarget));
$('sheetClose').addEventListener('click', closeSheet);
$('sheet').addEventListener('click', e => { if(e.target === $('sheet')) closeSheet(); });
$('fab').addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

// restore saved prefs before first paint
root.setAttribute('data-theme', THEME);
root.setAttribute('lang', LANG);
root.setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
document.body.classList.toggle('lang-en', LANG === 'en');
document.body.classList.toggle('lang-ar', LANG === 'ar');
try{ history.replaceState({v:'home', idx:0}, '', location.pathname + location.search + location.hash); }catch(e){}

// intro splash: once per session
(function intro(){
  const el = $('intro');
  let seen = false;
  const forced = new URLSearchParams(location.search).has('intro');
  try{ seen = sessionStorage.getItem('dl_intro') === '1'; sessionStorage.setItem('dl_intro', '1'); }catch(e){}
  if((seen && !forced) || reduceMotion){ el.remove(); return; }
  armIntroSound(performance.now());
  setTimeout(() => el.remove(), 2400);
})();

applyStaticText();
renderSkeleton();
startPlaceholder();
loadData().then(() => { renderAll(); routeFromHash(); });
setInterval(refreshOpenChips, 60000);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
